services:
  # 1. REDIS (Needed for Celery to function)
  redis:
    image: redis:alpine
    container_name: recipe_agent_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. CELERY WORKER (The Brain)
  celery_worker:
    build: .
    container_name: recipe_agent_worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Internal Docker Networking for Redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      # Mount code for hot-reloading
      - .:/app
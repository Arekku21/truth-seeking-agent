services:
  # 1. REDIS (Needed for Celery to function)
  redis:
    image: redis:alpine
    container_name: recipe_agent_redis
    restart: always
    command: redis-server --maxmemory 200mb --maxmemory-policy noeviction
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Hard limit: 1 CPU core
          memory: 256m       # Hard limit: 512 MB RAM

  # 2. FASTAPI SERVER (The API Gateway)
  fastapi:
    build: ./app
    restart: always
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./app:/app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 500m
        reservations:
          memory: 300m

  # 3. CELERY WORKER (The Brain)
  celery_worker:
    build: ./app
    restart: always
    working_dir: /app
    command: celery -A celery_config worker --loglevel=info --concurrency=8 #change concurrency to 1 whatever the number of CPU cores you want to allocate (1 is usually sufficient for agents testing)
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Mount code for hot-reloading
      - ./app:/app
    deploy:
      resources:
        limits:
          cpus: '2.0'        
          memory: 1g       
        reservations:
          memory: 512m
  # 4. FLOWER (The Monitor)
  flower:
    build: ./app
    working_dir: /app
    command: celery -A celery_config flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    env_file:
      - .env
    volumes:
      - ./app:/app
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

